name: Auto Deploy

on:
  push:
    branches:
      - main # Triggers when you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run SSH Deploy Commands
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        script: |
          set -e
          # Go to the deployment directory on VPS
          cd /opt/crediiflow

          # Pull the latest changes from Git
          git pull origin main

          # Stop and remove all containers including orphans from previous deploys
          docker compose down --remove-orphans

          # Force-remove any stale named containers that may conflict
          docker rm -f crediiflow_db crediiflow_backend crediiflow_frontend crediiflow_superadmin_frontend crediiflow_landing_page crediiflow_nginx 2>/dev/null || true
          
          # Safely prune stopped containers and unused networks to clear stale references
          docker container prune -f
          docker network prune -f
          
          # Rebuild and start all services
          docker compose up -d --build
          
          # Clean up unused/dangling docker images to save space
          docker image prune -f
