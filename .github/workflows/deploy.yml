name: Auto Deploy

on:
  push:
    branches:
      - main # Triggers when you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run SSH Deploy Commands
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        script: |
          set -e
          # Go to the deployment directory on VPS
          cd /opt/crediiflow

          # Fetch latest and hard-reset to avoid dirty tree / merge conflicts on VPS
          git fetch origin main
          git reset --hard origin/main

          # Prune old dangling images & build cache to free memory/disk before building
          docker image prune -f || true
          docker builder prune -f || true

          # Rebuild and start all services
          docker compose up -d --build
