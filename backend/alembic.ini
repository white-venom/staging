# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path additions will be prepended to sys.path if present
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone = UTC

# max length of characters to write to the 'slug' field in migration file names
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow empty migrations to be created
# from the 'revision' command when no autogenerate changes are detected
# allow_empty_history = false

# version location specification; this defaults
# to alembic/versions.  when using multiple version
# directories, paths must be separated by locales-dependent
# separators or semicolons
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# version path separator; is a single character
# used to split version_locations when written in
# Multiple lines. Defaults to the operating system's path separator.
# version_path_separator = :

# set to 'true' to search for newer versions in the
# version_locations directory.  defaults to 'false'.
# search_for_newer_versions = false

# set to 'true' to enable hook logging. hook logging allows scripts
# to run after specific commands such as 'revision' or 'upgrade'
# enable_hooks = false

# logging configuration is at the end of this file.

[logging]
# logging configuration
default = WARNING

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
# "level = INFO" logs SQL queries.
# "level = WARNING" logs only warnings.
# "level = ERROR" logs only errors.

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
