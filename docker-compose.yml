version: '3.8'

networks:
  crediiflow_network:
    driver: bridge

volumes:
  postgres_data:
    name: do-it-services_postgres_data
    external: true
  letsencrypt_certs:
    driver: local
  certbot_www:
    name: do-it-services_certbot_www
    external: true

services:
  db:
    image: postgres:16-alpine
    container_name: crediiflow_db
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: postgres -c max_connections=400 -c shared_buffers=256MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doit_production}
      POSTGRES_USER: ${POSTGRES_USER:-doit_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - crediiflow_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doit_admin} -d ${POSTGRES_DB:-doit_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crediiflow_backend
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${PORT:-8000}
    volumes:
      - ./triggers:/app/triggers
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crediiflow_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crediiflow_frontend
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - crediiflow_network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3

  superadmin-frontend:
    build:
      context: ./superadmin-frontend
      dockerfile: Dockerfile
    container_name: crediiflow_superadmin_frontend
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=https://api.crediiflow.in
    networks:
      - crediiflow_network
    depends_on:
      - backend

  landing-page:
    build:
      context: ./landing-page
      dockerfile: Dockerfile
    container_name: crediiflow_landing_page
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - HOSTNAME=0.0.0.0
    networks:
      - crediiflow_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: crediiflow_nginx
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
      - superadmin-frontend
      - landing-page
    networks:
      - crediiflow_network
